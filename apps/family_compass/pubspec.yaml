publish_to: "none"
version: 0.3.0-dev.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  firebase_app_installations: ^0.4.2+7
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: any
  shared_preferences: ^2.5.3
